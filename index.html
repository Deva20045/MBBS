<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0810">
<title>PULSE MBBS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%230b0810'/%3E%3Cpath d='M16 54h18l9-25 13 44 9-27h19' fill='none' stroke='%23e0607e' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0810; --bg2:#120d1b; --card:#191223; --card2:#211830; --line:#2d2340; --line2:#3b2d55;
    --txt:#f6f2fb; --mut:#9c8fb8; --dim:#6d6188;
    --pink:#e0607e; --gold:#d8ae63; --teal:#5fd0b5; --good:#3ddc84;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,'Times New Roman',serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  body{margin:0;font-family:var(--sans);color:var(--txt);min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(1100px 520px at 50% -240px,#33204a 0%,transparent 60%),
      radial-gradient(760px 380px at 108% 6%,#1d1430 0%,transparent 58%),
      var(--bg);
    padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  .shell{max-width:900px;margin:0 auto;padding:0 14px}

  /* ---------------- top bar ---------------- */
  header{position:sticky;top:0;z-index:40;background:#0b0810e6;backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);border-bottom:1px solid #ffffff10}
  .bar{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:58px}
  .icobtn{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:12px;
    background:none;border:1px solid transparent;color:var(--txt);cursor:pointer;transition:.18s}
  .icobtn:hover{background:#ffffff0d;border-color:var(--line)}
  .mark{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer;background:none;border:0;color:inherit;padding:0;font-family:inherit}
  .mark .glyph{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(140deg,#3a2154,#1d1430);border:1px solid var(--line2)}
  .mark b{font-family:var(--serif);font-size:19px;letter-spacing:.4px;line-height:1}
  .mark small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:2.4px;color:var(--dim);margin-top:3px}
  .barlabel{flex:1;min-width:0;font-family:var(--serif);font-size:16.5px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:.22s}
  .barlabel.on{opacity:1;transform:none}
  .pct{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--mut);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
  .pct i{font-style:normal;font-family:var(--mono);color:var(--teal)}

  /* ---------------- views ---------------- */
  .view{animation:in .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  h1.big{font-family:var(--serif);font-size:clamp(34px,8.5vw,52px);line-height:1.02;letter-spacing:-.8px;margin:26px 0 8px}
  .kicker{font-size:10.5px;font-weight:800;letter-spacing:3px;color:var(--gold)}
  .stats{display:flex;gap:22px;margin:16px 0 6px;flex-wrap:wrap}
  .stats div{line-height:1.25}
  .stats b{display:block;font-family:var(--serif);font-size:23px}
  .stats span{font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--dim);text-transform:uppercase}
  .rule{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin:22px 0 4px}
  .subhead{font-size:10.5px;font-weight:800;letter-spacing:2.6px;color:var(--dim);text-transform:uppercase;margin:22px 2px 10px}

  /* ---------------- subject grid ---------------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
  .card{position:relative;text-align:left;background:linear-gradient(158deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:20px;padding:16px 15px 14px;cursor:pointer;overflow:hidden;
    color:inherit;font-family:inherit;transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s,box-shadow .2s}
  .card::before{content:'';position:absolute;left:0;top:0;height:2px;width:100%;
    background:linear-gradient(90deg,var(--acc),transparent 72%)}
  .card::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle 190px at 100% -30%,var(--glow),transparent 68%)}
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--acc);
    box-shadow:0 20px 44px #00000066;outline:none}
  .card .top{display:flex;align-items:center;gap:11px;position:relative}
  .card .em{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;font-size:20px;
    background:#ffffff09;border:1px solid var(--line2)}
  .card h3{margin:0;font-family:var(--serif);font-size:19px;letter-spacing:-.2px}
  .card .sp{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--dim);text-transform:uppercase;margin-top:3px}
  .card .meta{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:15px}
  .card .meta .n{font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.5}
  .card .meta .n b{color:var(--txt);font-weight:700}
  .ring{width:38px;height:38px;flex:0 0 38px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--mut)}
  .bar2{height:2px;background:#ffffff12;border-radius:2px;overflow:hidden;margin-top:12px;position:relative}
  .bar2 i{display:block;height:100%;background:var(--acc);border-radius:2px}
  .shared{font-family:var(--mono);font-size:10px;color:var(--gold);margin-left:5px}

  /* ---------------- chapter rows ---------------- */
  .rows{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
    border-radius:15px;padding:13px 14px;cursor:pointer;color:inherit;font-family:inherit;text-align:left;
    transition:transform .16s,border-color .16s,background .16s}
  .row:hover,.row:focus-visible{border-color:var(--line2);background:var(--card2);transform:translateX(3px);outline:none}
  .num{flex:0 0 38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--mono);
    font-size:12.5px;font-weight:700;color:var(--acc-t,var(--mut));background:#ffffff08;border:1px solid var(--line)}
  .row .tx{flex:1;min-width:0}
  .row .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
  .row .tx span{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .chev{flex:0 0 auto;color:var(--dim)}
  .tick{flex:0 0 auto;color:var(--good);font-size:14px}

  /* unit rows */
  .urow{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:14px;
    background:#ffffff05;border:1px solid #ffffff0a;cursor:pointer;color:inherit;font-family:inherit;text-align:left;
    transition:background .16s,border-color .16s,transform .16s}
  .urow:hover,.urow:focus-visible{background:#ffffff0d;border-color:var(--line2);transform:translateX(3px);outline:none}
  .urow .ui{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);
    font-size:10.5px;font-weight:700;color:var(--dim);background:#ffffff0a}
  .urow.done .ui{background:#123324;color:var(--good)}
  .urow .ut{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
  .urow.done .ut{color:#c8bcdd}
  .urow .mini{font-family:var(--mono);font-size:10px;color:var(--dim)}
  .urow .open{font-size:11px;font-weight:800;color:var(--acc-t,var(--pink));opacity:0;transition:.18s}
  .urow:hover .open{opacity:1}

  /* ---------------- subject hero ---------------- */
  .hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;margin:18px 0 4px;
    padding:24px 20px;background:linear-gradient(158deg,var(--card2),#150f20)}
  .hero::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle 260px at 96% -30%,var(--glow),transparent 70%)}
  .hero .kick{position:relative}
  .hero h1{position:relative;font-family:var(--serif);font-size:clamp(30px,7.5vw,44px);margin:8px 0 0;letter-spacing:-.6px;line-height:1.04}
  .hero .stats{position:relative}
  .actions{position:relative;display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:13px;padding:12px 17px;font-size:13.5px;
    font-weight:800;cursor:pointer;font-family:inherit;border:1px solid var(--line2);background:none;color:var(--txt);
    text-decoration:none;transition:.18s}
  .btn:hover{border-color:var(--acc);color:#fff}
  .btn.solid{background:linear-gradient(135deg,#f0788f,var(--pink));border-color:transparent;color:#23101a}
  .crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin:20px 2px 0;font-weight:700}
  .crumb button{background:none;border:0;color:var(--mut);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;padding:0}
  .crumb button:hover{color:var(--txt)}

  /* ---------------- search ---------------- */
  .searchwrap{padding:12px 0 2px;display:none}
  .searchwrap.on{display:block}
  .field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);
    border-radius:15px;padding:12px 14px}
  .field input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--txt);font-family:inherit;font-size:15px}
  .field input::placeholder{color:var(--dim)}
  .field button{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
  .hint{font-size:10.5px;font-weight:800;letter-spacing:1.6px;color:var(--dim);text-transform:uppercase;margin:16px 2px 9px}
  .nofound{color:var(--mut);font-size:13.5px;padding:22px 2px}
  mark{background:#e0607e33;color:#ffd9e3;border-radius:4px;padding:0 2px}

  .empty{padding:56px 10px;text-align:center;color:var(--dim);font-size:13px}
  footer{max-width:900px;margin:34px auto 0;padding:18px 14px 0;border-top:1px solid #ffffff0d;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:#4f4568;text-transform:uppercase}
  @media (max-width:430px){ .grid{grid-template-columns:1fr 1fr} .card{padding:13px 12px 12px}
    .card h3{font-size:16px} .card .em{width:36px;height:36px;flex-basis:36px;font-size:17px}
    .mark b{font-size:17px} .pct{padding:5px 9px} .urow .open{display:none} }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

    </button>
    <button class="mark" id="homeBtn">
      <span class="glyph"><svg width="20" height="20" viewBox="0 0 100 100"><path d="M12 55h18l9-26 13 45 9-28h27" fill="none" stroke="#e0607e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><b>PULSE</b><small id="markSub">MBBS</small></span>

    </button>
  </div>
  <div class="shell searchwrap" id="searchWrap">
    <div class="field">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9c8fb8" stroke-width="2.3" stroke-linecap="round" style="flex:0 0 17px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.7-3.7"/></svg>
      <input id="q" type="search" placeholder="Chapter, unit or subject…" autocomplete="off" spellcheck="false">
      <button id="qClear" aria-label="Close search">×</button>
    </div>
  </div>
</header>

<main class="shell" id="app"></main>

<footer>
  <span>PULSE · MBBS</span>
  <span id="footMeta"></span>
</footer>

  {id:'obg',   name:'Obs',           sp:'OBG',           em:'🤰', acc:'#9b7fe0', glow:'rgba(155,127,224,.16)', key:'pulse_done', pre:'OBG',
   url:'https://deva20045.github.io/OBG/pulse-obg.html'},
  {id:'pharm', name:'Pharm',         sp:'Pharmacology',  em:'💊', acc:'#6fd08a', glow:'rgba(111,208,138,.16)', key:'pulse_done', pre:'PHARM',
   url:'https://deva20045.github.io/Pharm/pulse-pharm-complete.html'},
  {id:'surg',  name:'Surgery',       sp:'Surgery',       em:'🔪', acc:'#e0885a', glow:'rgba(224,136,90,.16)',  key:'pulse_surgery_done', pre:'SURG',
   url:'https://deva20045.github.io/Surgery/pulse-surgery-complete.html'},
  {id:'derma', name:'Derma',         sp:'Dermatology',   em:'🧴', acc:'#e07aa8', glow:'rgba(224,122,168,.16)', key:'derm-app-state', pre:'', stratum:true,
   url:'https://deva20045.github.io/Stratum/'},
  {id:'ortho', name:'Ortho',         sp:'Orthopaedics',  em:'🦴', acc:'#5aa9e0', glow:'rgba(90,169,224,.16)',  key:'pulse_done', pre:'ORTHO',
   url:'https://deva20045.github.io/ORTHO/pulse-ortho-complete.html'},
  {id:'oph',   name:'Ophthalmology', sp:'Ophthalmology', em:'👁️', acc:'#7fc4e0', glow:'rgba(127,196,224,.16)', key:'pulseOph_done', pre:'OPH',
   url:'https://deva20045.github.io/OPHTHAL/pulse-ophthalmology.html'}
];

/* ================= storage (same origin as the modules) ============ */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function doneSet(s){
  const set = new Set();
  if (s.stratum){
    const raw = lsGet('derm-app-state'); if(!raw) return set;
    try{
      const st = JSON.parse(raw); const stars = st.unitStars || {};
      DATA[s.id].u.forEach(u=>{
        const k = 'ch'+DATA[s.id].c[u[0]][0]+'::'+u[1];
        if(stars[k] !== undefined) set.add(k);
      });
    }catch(e){}
    return set;
  }
  const raw = lsGet(s.key); if(!raw) return set;
  try{
    const arr = JSON.parse(raw); if(!Array.isArray(arr)) return set;
    arr.forEach(id=>{ if(typeof id==='string' && (!s.pre || id.indexOf(s.pre+'-')===0)) set.add(id); });
  }catch(e){}
  return set;
}

/* ================= helpers ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marked = (text,q) => {
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
};
const num = n => n.toLocaleString('en-IN');
const chaptersOf = s => DATA[s.id].c;
const unitsOf = s => DATA[s.id].u;
const uKeyOf = (s,u) => s.stratum ? ('ch'+chaptersOf(s)[u[0]][0]+'::'+u[1]) : u[1];
const isDone = (s,u) => { const d = progress[s.id]; return d ? d.has(uKeyOf(s,u)) : false; };
const ring = (pct, acc, size) => {
  size = size || 38; const r = size/2 - 3.4, c = 2*Math.PI*r, off = c*(1 - Math.min(pct,100)/100);
  return '<span class="ring" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#ffffff14" stroke-width="3"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+acc+'" stroke-width="3" stroke-linecap="round"'
    + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'
    + '<span>'+(!size||size>30 ? (pct>=1?Math.round(pct)+'%':'·') : '')+'</span></span>';
};

/* ================= state ================= */
let view = {level:'home'};
let query = '';
let progress = {};
function computeProgress(){
  progress = {};
  let dAll = 0, uAll = 0;
  SUBJECTS.forEach(s=>{
    const d = doneSet(s); progress[s.id] = d;
    dAll += d.size; uAll += unitsOf(s).length;
  });
  const pct = uAll ? (100*dAll/uAll) : 0;
  document.getElementById('pctVal').textContent = uAll
    ? (pct>0 && pct<1 ? '<1%' : Math.round(pct)+'%') : '—';
  return {dAll, uAll, pct};
}

/* ================= views ================= */
const app = document.getElementById('app');
const barLabel = document.getElementById('barLabel');
const backBtn = document.getElementById('backBtn');
const searchWrap = document.getElementById('searchWrap');
const qInput = document.getElementById('q');

function totals(){
  let c=0,u=0; SUBJECTS.forEach(s=>{ c+=chaptersOf(s).length; u+=unitsOf(s).length; });
  return {c,u};
}

function render(){
  searchWrap.classList.toggle('on', view.level==='search');
  backBtn.style.display = view.level==='home' ? 'none' : 'grid';
  barLabel.classList.toggle('on', view.level!=='home' && view.level!=='search');
  barLabel.textContent = view.level==='subject' ? subjectById(view.s).name
    : view.level==='chapter' ? subjectById(view.s).name + ' · ' + (view.ci+1) : '';
  document.getElementById('markSub').textContent = view.level==='home' ? 'MBBS' : 'MBBS';
  if (view.level==='home')      app.innerHTML = viewHome();
  else if (view.level==='subject') app.innerHTML = viewSubject(subjectById(view.s));
  else if (view.level==='chapter') app.innerHTML = viewChapter(subjectById(view.s), view.ci);
  else if (view.level==='search') app.innerHTML = viewSearch(query);
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant' : 'auto'});
}
const subjectById = id => SUBJECTS.find(s=>s.id===id);

function viewHome(){
  const {dAll,uAll,pct} = computeProgress();
  const t = totals();
  document.getElementById('footMeta').textContent = num(t.c)+' chapters · '+num(t.u)+' units';
  return '<div class="view">'
    + '<div class="kicker">MARROW EDITION 8</div>'
    + '<h1 class="big">MBBS</h1>'
    + '<div class="stats">'
      + '<div><b>'+SUBJECTS.length+'</b><span>Subjects</span></div>'
      + '<div><b>'+num(t.c)+'</b><span>Chapters</span></div>'
      + '<div><b>'+num(t.u)+'</b><span>Units</span></div>'
      + (uAll ? '<div><b>'+num(dAll)+'</b><span>Completed</span></div>' : '')
    + '</div>'
    + '<div class="rule"></div>'
    + '<div class="subhead">Subjects</div>'
    + '<div class="grid">' + SUBJECTS.map(s=>card(s)).join('') + '</div>'
  + '</div>';
}

function card(s){
  const ch = chaptersOf(s), un = unitsOf(s), d = progress[s.id] ? progress[s.id].size : 0;
  const pct = un.length ? 100*d/un.length : 0;
  return '<button class="card" data-sub="'+s.id+'" style="--acc:'+s.acc+';--glow:'+s.glow+';--acc-t:'+s.acc+'">'
    + '<span class="top"><span class="em">'+s.em+'</span>'
      + '<span><h3>'+esc(s.name)+'</h3><span class="sp">'+esc(s.sp)+'</span></span></span>'
    + '<span class="meta">'
      + '<span class="n"><b>'+ch.length+'</b> chapters<br><b>'+un.length+'</b> units' + (s.shared ? '<span class="shared" title="Medicine Vol 2 and Vol 3 write to the same storage key">◑ shared</span>' : '') + '</span>'
      + ring(pct, s.acc, 38)
    + '</span>'
    + '<span class="bar2"><i style="width:'+pct.toFixed(1)+'%"></i></span>'
  + '</button>';
}

function viewSubject(s){
  const ch = chaptersOf(s), un = unitsOf(s), d = progress[s.id] || new Set();
  const doneByCh = ch.map(()=>0);
  un.forEach(u=>{ if(isDone(s,u)) doneByCh[u[0]] = (doneByCh[u[0]]||0)+1; });
  const chUnits = ch.map(()=>0);
  un.forEach(u=>{ chUnits[u[0]] = (chUnits[u[0]]||0)+1; });
  const pct = un.length ? 100*d.size/un.length : 0;
  return '<div class="view" style="--acc:'+s.acc+';--glow:'+s.glow+';--acc-t:'+s.acc+'">'
    + '<div class="crumb"><button data-home>Subjects</button><span>/</span><span style="color:var(--mut)">'+esc(s.name)+'</span></div>'
    + '<div class="hero">'
      + '<div class="kick">'+esc(s.sp.toUpperCase())+'</div>'
      + '<h1>'+esc(s.name)+'</h1>'
      + '<div class="stats">'
        + '<div><b>'+ch.length+'</b><span>Chapters</span></div>'
        + '<div><b>'+un.length+'</b><span>Units</span></div>'
        + '<div><b>'+d.size+'</b><span>Done</span></div>'
      + '</div>'
      + '<div class="actions">'
        + '<a class="btn solid" href="'+s.url+'" target="_blank" rel="noopener noreferrer">Open module ↗</a>'
        + '<button class="btn" data-reset="'+s.id+'">Reset progress</button>'
      + '</div>'
      + (d.size ? '<div class="bar2" style="margin-top:16px"><i style="width:'+pct.toFixed(1)+'%"></i></div>' : '')
    + '</div>'
    + '<div class="subhead">Chapters</div>'
    + '<div class="rows">' + ch.map((c,i)=>{
        const cc = chUnits[i]||0, dd = doneByCh[i]||0;
        const cp = cc ? 100*dd/cc : 0;
        return '<button class="row" data-ch="'+i+'">'
          + '<span class="num">'+String(c[0]).padStart(2,'0')+'</span>'
          + '<span class="tx"><b>'+esc(c[1])+'</b><span>'+cc+' units'+(c[2]?' · p'+c[2]:'')+(dd?' · '+dd+' done':'')+'</span></span>'
          + (cp>=100 ? '<span class="tick">✓</span>' : ring(cp, s.acc, 30))
          + '<svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'
        + '</button>';
      }).join('') + '</div>'
  + '</div>';
}

function viewChapter(s, ci){
  const ch = chaptersOf(s), c = ch[ci];
  const us = unitsOf(s).filter(u=>u[0]===ci);
  const done = us.filter(u=>isDone(s,u)).length;
  return '<div class="view" style="--acc:'+s.acc+';--glow:'+s.glow+';--acc-t:'+s.acc+'">'
    + '<div class="crumb"><button data-home>Subjects</button><span>/</span><button data-back-sub>'+esc(s.name)+'</button><span>/</span><span style="color:var(--mut)">'+String(c[0]).padStart(2,'0')+'</span></div>'
    + '<div class="hero">'
      + '<div class="kick">CHAPTER '+String(c[0]).padStart(2,'0')+'</div>'
      + '<h1 style="font-size:clamp(23px,5.6vw,33px)">'+esc(c[1])+'</h1>'
      + '<div class="stats">'
        + '<div><b>'+us.length+'</b><span>Units</span></div>'
        + (c[2] ? '<div><b>p'+c[2]+'</b><span>Book</span></div>' : '')
        + '<div><b>'+done+'</b><span>Done</span></div>'
      + '</div>'
      + '<div class="actions"><a class="btn" href="'+s.url+'" target="_blank" rel="noopener noreferrer">Open '+esc(s.name)+' module ↗</a></div>'
    + '</div>'
    + '<div class="subhead">Units</div>'
    + '<div class="rows">' + (us.length ? us.map((u,i)=>{
        const doneU = isDone(s,u);
        return '<a class="urow '+(doneU?'done':'')+'" href="'+s.url+'" target="_blank" rel="noopener noreferrer">'
          + '<span class="ui">'+(doneU?'✓':(i+1))+'</span>'
          + '<span class="ut">'+esc(u[2])+'</span>'
          + '<span class="mini">'+esc(String(u[1]))+'</span>'
          + '<span class="open">OPEN ↗</span>'
        + '</a>';
      }).join('') : '<div class="empty">No units listed for this chapter.</div>') + '</div>'
  + '</div>';
}

/* ================= search ================= */
function resultsFor(q){
  const Q = q.trim().toLowerCase();
  if (Q.length < 1) return {subs:[],chs:[],uns:[]};
  const subs=[],chs=[],uns=[];
  SUBJECTS.forEach(s=>{
    if ((s.name+' '+s.sp).toLowerCase().includes(Q)) subs.push(s);
    chaptersOf(s).forEach((c,ci)=>{ if (c[1].toLowerCase().includes(Q)) chs.push({s,ci,c}); });
    unitsOf(s).forEach(u=>{ if (u[2].toLowerCase().includes(Q)) uns.push({s,u}); });
  });
  return {subs,chs,uns};
}
function viewSearch(q){
  const {subs,chs,uns} = resultsFor(q);
  const CAP = 80;
  const total = subs.length+chs.length+uns.length;
  if (!q.trim()) return '<div class="empty">Type to search '+num(totals().u)+' units.</div>';
  if (!total) return '<div class="nofound">No match for “'+esc(q)+'”.</div>';
  let html = '<div class="view">';
  if (subs.length){
    html += '<div class="hint">Subjects · '+subs.length+'</div><div class="grid">'+subs.map(s=>card(s)).join('')+'</div>';
  }
  if (chs.length){
    html += '<div class="hint">Chapters · '+chs.length+'</div><div class="rows">'+chs.slice(0,CAP).map(r=>
      '<button class="row" data-sub="'+r.s.id+'" data-goch="'+r.ci+'">'
      + '<span class="num" style="--acc-t:'+r.s.acc+'">'+String(r.c[0]).padStart(2,'0')+'</span>'
      + '<span class="tx"><b>'+marked(r.c[1],q)+'</b><span>'+esc(r.s.name)+'</span></span>'
      + '<svg class="chev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'
      + '</button>').join('')+'</div>' + (chs.length>CAP?'<div class="hint">+ '+(chs.length-CAP)+' more</div>':'');
  }
  if (uns.length){
    html += '<div class="hint">Units · '+uns.length+'</div><div class="rows">'+uns.slice(0,CAP).map(r=>
      '<a class="urow" href="'+r.s.url+'" target="_blank" rel="noopener noreferrer">'
      + '<span class="ui" style="color:'+r.s.acc+'">'+r.s.em+'</span>'
      + '<span class="ut">'+marked(r.u[2],q)+'</span>'
      + '<span class="mini">'+esc(r.s.name)+'</span>'
      + '<span class="open">OPEN ↗</span>'
      + '</a>').join('')+'</div>' + (uns.length>CAP?'<div class="hint">+ '+(uns.length-CAP)+' more — refine your search</div>':'');
  }
  return html + '</div>';
}

/* ================= interaction ================= */
app.addEventListener('click', e=>{
  const sub = e.target.closest('[data-sub]');
  const ch  = e.target.closest('[data-ch]');
  const home = e.target.closest('[data-home]');
  const backSub = e.target.closest('[data-back-sub]');
  const reset = e.target.closest('[data-reset]');
  if (reset){ resetProgress(reset.dataset.reset); return; }
  if (home){ view={level:'home'}; render(); return; }
  if (backSub){ view={level:'subject', s:backSub.closest('[data-sub]') ? view.s : view.s}; view={level:'subject', s:view.s}; render(); return; }
  if (ch && view.level==='subject'){ view={level:'chapter', s:view.s, ci:+ch.dataset.ch}; render(); return; }
  if (sub){
    const id = sub.dataset.sub;
    if (sub.dataset.goch != null){ view={level:'chapter', s:id, ci:+sub.dataset.goch}; closeSearch(); }
    else { view={level:'subject', s:id}; }
    render(); return;
  }
});
function resetProgress(id){
  const s = subjectById(id);
  if (!confirm('Clear saved progress for '+s.name+'? This erases it inside the module itself.')) return;
  try{
    if (s.stratum) localStorage.removeItem('derm-app-state');
    else localStorage.setItem(s.key, '[]');
  }catch(e){}
  render();
}
backBtn.addEventListener('click', ()=>{
  if (view.level==='chapter') view={level:'subject', s:view.s};
  else if (view.level==='subject') view={level:'home'};
  else if (view.level==='search') closeSearch();
  render();
});
document.getElementById('homeBtn').addEventListener('click', ()=>{ closeSearch(); view={level:'home'}; render(); });
function openSearch(){ view={level:'search'}; query=qInput.value; render(); qInput.focus(); }
function closeSearch(){ searchWrap.classList.remove('on'); }
document.getElementById('searchBtn').addEventListener('click', ()=>{
  if (view.level==='search'){ view={level:'home'}; render(); } else openSearch();
});
qInput.addEventListener('input', ()=>{ query=qInput.value; if (view.level!=='search') view={level:'search'}; render(); qInput.focus(); });
document.getElementById('qClear').addEventListener('click', ()=>{
  qInput.value=''; query=''; view={level:'home'}; render();
});
document.addEventListener('keydown', e=>{
  if (e.key==='/' && document.activeElement!==qInput){ e.preventDefault(); openSearch(); }
  if (e.key==='Escape'){ if (view.level==='search'){ qInput.value=''; query=''; view={level:'home'}; render(); } else backBtn.click(); }
});
addEventListener('storage', ()=>{ render(); });
addEventListener('focus', ()=>{ render(); });
computeProgress();
render();
</script>
</body>
</html>
